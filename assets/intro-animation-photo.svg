<svg viewBox="0 0 800 260" xmlns="http://www.w3.org/2000/svg">

  <!-- ground line -->
  <line x1="20" y1="215" x2="780" y2="215" stroke="#2b2b3b" stroke-width="2" stroke-dasharray="4 6" opacity="0.5"/>

  <defs>
    <clipPath id="avatarClip">
      <circle cx="0" cy="0" r="70"/>
    </clipPath>
  </defs>

  <!-- ===================== PHOTO SLIDING + FADING IN ===================== -->
  <g id="photoGroup" opacity="0" transform="translate(-120,110)">
    <animateTransform attributeName="transform" type="translate"
      values="-120,110;120,110;120,110" keyTimes="0;1;1" dur="1.6s" begin="0s" fill="freeze"/>
    <animate attributeName="opacity" values="0;1;1" keyTimes="0;1;1" dur="1.6s" begin="0s" fill="freeze"/>

    <circle cx="0" cy="0" r="74" fill="#0b0d10" stroke="#00e0f0" stroke-width="4"/>
    <g clip-path="url(#avatarClip)">
      <image href="data:image/jpeg;base64," x="-70" y="-70" width="140" height="140" preserveAspectRatio="xMidYMid slice"/>
    </g>
  </g>

  <!-- ===================== TEXT DROPPING DOWN ===================== -->
  <g id="textGroup" opacity="0">
    <animateTransform attributeName="transform" type="translate"
      values="0,-140;0,-140;0,60" keyTimes="0;0.55;1"
      keySplines="0 0 1 1;0.32 1.6 0.5 1" calcMode="spline"
      dur="2.6s" begin="0s" fill="freeze"/>
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.55;1"
      dur="2.6s" begin="0s" fill="freeze"/>

    <rect x="230" y="80" width="500" height="60" rx="14" fill="#101425" stroke="#00e0f0" stroke-width="1.5"/>
    <text x="480" y="119" text-anchor="middle" font-family="Verdana, Segoe UI, sans-serif"
      font-size="24" font-weight="bold" fill="#00e0f0">
      Hi, Abdullah — Developer here 👋
    </text>
  </g>

</svg>
